name: Release

# Push a tag like v1.0 to build a signed APK (no API key inside) and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # .env is gitignored, so the key is empty here and the app asks for it on first launch.
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS repo secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "haiku-wall-${GITHUB_REF_NAME}.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/apksigner" verify "haiku-wall-${GITHUB_REF_NAME}.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "haiku-wall-${GITHUB_REF_NAME}.apk" --title "Haiku Wall $GITHUB_REF_NAME" --generate-notes
